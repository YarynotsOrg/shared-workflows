name: reusable workflow for log cleanup
description: Use for cleanup log files

on:
  workflow_call:
    inputs:
      repo-name:
        description: The repo name.
        required: true
        type: string

jobs:
  
  cleanup:

    runs-on: ubuntu-latest
    
    steps:

    - uses: actions/checkout@v4
      
    - name: echo gh version
      run: gh --version

    - name: authenticate
      run: gh auth login --with-token ${{ secrets.GITHUB_TOKEN }}

    - name: execute cleanup commands       
      run: |
        echo "Cleaning up log files in ${{ inputs.repo-name }}"
        $workflowRuns = gh api repos/${{ inputs.repo-name }}/actions/runs --paginate --jq '.workflow_runs[].id'
        foreach($runId in $workflowRuns){gh api repos/$Owner/$Repo/actions/runs/$runId -X DELETE}
      shell: bash

